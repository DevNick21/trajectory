# Dev overlay — applies on top of docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# What it adds:
#   - Source code mounted into backend container so edits hot-
#     reload without rebuilds (uvicorn --reload).
#   - Vite dev server replaces the Nginx static build for the frontend.
#   - Backend port :8000 + frontend port :5173 stay the same as the
#     non-Docker dev experience.

services:
  backend:
    command: ["uvicorn", "askpicky.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./packages/engine/src:/app/packages/engine/src
      - ./packages/core/src:/app/packages/core/src
      - ./packages/parsers/src:/app/packages/parsers/src
      - ./packages/evaluators/src:/app/packages/evaluators/src
      - ./packages/privacy/src:/app/packages/privacy/src
      - ./packages/ai/src:/app/packages/ai/src
      - ./scripts:/app/scripts
      - askpicky-data:/data
    environment:
      ASKPICKY_TEST_MODE: ""  # ensure prod-mode secret check runs

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./apps/web:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://backend:8000

volumes:
  frontend-node-modules:
