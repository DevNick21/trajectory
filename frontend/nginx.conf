server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every unknown route falls back to index.html so client-side
    # routing (react-router) can resolve /sessions/:id and friends.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend proxy. `backend` is the docker-compose service name; in
    # standalone deployments override the upstream via build-arg or
    # environment-injected nginx config.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE: forward_job + full_prep stream events. Buffering off so
        # ticks land in the browser as they're emitted, not bundled.
        proxy_buffering    off;
        proxy_read_timeout 600s;
    }

    # Health check passthrough for container orchestrators.
    location = /health {
        proxy_pass http://backend:8000/health;
    }
}
