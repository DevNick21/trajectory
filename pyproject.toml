[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "askpicky"
version = "1.0.0"
description = "AskPicky — UK-first, visa-aware, agent-powered job search assistant. Verify roles before you apply."
requires-python = ">=3.11"
# Runtime deps live in requirements.txt so pip-install-from-source and
# the smoke-test venv agree on a single source of truth. `pip install -e .`
# installs the package without re-declaring them here.

[tool.setuptools.packages.find]
where = ["src"]
include = ["askpicky*"]

[tool.setuptools.package-data]
# Ship the prompt Markdown files alongside the Python package so
# `pip install askpicky` on a fresh host can load_prompt(...) without
# relying on a source checkout. Covers both top-level prompt files and
# nested folders (onboarding/*.md).
askpicky = ["prompts/*.md", "prompts/**/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]
exclude = ["**/__pycache__", "**/node_modules", "tests", "scripts", "frontend", "demo"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
pythonVersion = "3.11"
