[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "askpicky"
version = "1.0.0"
description = "AskPicky — UK-first, visa-aware, agent-powered job search assistant. Verify roles before you apply."
requires-python = ">=3.11"
dependencies = [
    # PDF CV and offer-letter extraction import pypdf directly. Keep it in
    # package metadata so `pip install -e .` supports that upload path.
    "pypdf>=4.0.0",
]
# Full app/runtime deps live in requirements.txt so local development and
# smoke-test environments agree on one source for the complete stack.

[tool.setuptools.packages.find]
where = [
    "packages/engine/src",
    "packages/core/src",
    "packages/parsers/src",
    "packages/retrieval/src",
    "packages/evaluators/src",
    "packages/privacy/src",
    "packages/ai/src",
]
include = ["askpicky*"]

[tool.setuptools.package-data]
# Ship the prompt Markdown files alongside the Python package so
# `pip install askpicky` on a fresh host can load_prompt(...) without
# relying on a source checkout. Covers both top-level prompt files and
# nested folders (onboarding/*.md).
askpicky = ["prompts/*.md", "prompts/**/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
typeCheckingMode = "basic"
include = [
    "packages/engine/src",
    "packages/core/src",
    "packages/parsers/src",
    "packages/retrieval/src",
    "packages/evaluators/src",
    "packages/privacy/src",
    "packages/ai/src",
]
exclude = ["**/__pycache__", "**/node_modules", "tests", "scripts", "apps/web", "apps/extension", "demo"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
pythonVersion = "3.11"
