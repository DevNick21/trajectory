server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # SPA: every unknown route falls back to index.html so client-side
    # routing (react-router) can resolve /sessions/:id and friends.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend proxy. `backend` is the docker-compose service name; in
    # standalone deployments override the upstream via build-arg or
    # environment-injected nginx config.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE: forward_job + full_prep stream events. Buffering off so
        # ticks land in the browser as they're emitted, not bundled.
        # `proxy_buffering off` is the headline switch; `proxy_cache off`
        # disables HTTP cache; `chunked_transfer_encoding on` keeps the
        # response framed; gzip off because gzip will buffer until the
        # window fills. The backend also sets `X-Accel-Buffering: no` —
        # belt-and-braces.
        proxy_buffering          off;
        proxy_cache              off;
        chunked_transfer_encoding on;
        gzip                     off;
        # TCP-level: disable Nagle's algorithm so small SSE frames
        # (~80-200 bytes per agent_complete event) are pushed to the
        # browser immediately rather than being held in the kernel
        # send buffer until a full TCP segment fills.
        tcp_nopush               off;
        tcp_nodelay              on;
        proxy_read_timeout       600s;
        # Prevent nginx from passing the client's Connection header
        # to upstream — an incoming Connection: close would cause
        # the backend to terminate the SSE stream prematurely.
        proxy_set_header         Connection         "";
    }

    # Health check passthrough for container orchestrators.
    location = /health {
        proxy_pass http://backend:8000/health;
    }
}
